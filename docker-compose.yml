version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: themindupgrade_app
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/themindupgrade?schema=public
      - NEXT_PUBLIC_ADMIN_PASSWORD=admin123
      - NODE_ENV=production
    depends_on:
      - postgres
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: themindupgrade_db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=themindupgrade
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
