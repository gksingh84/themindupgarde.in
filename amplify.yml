version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --cache .npm --prefer-offline || npm install
    build:
      commands:
        - env | grep -E '^(APP_AWS_|DYNAMODB_|DYNAMO_|TMU_|MY_AWS_|NEXT_PUBLIC_|ADMIN_|DATABASE_)' >> .env.production || true
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
      - node_modules/**/*
