    <path d="M38 15 L22 48 H36 L32 75 L50 42 H36 Z" fill="#FFFFFF"/>
  </g>

  <text x="400" y="315" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="22" fill="#1E1B4B">
