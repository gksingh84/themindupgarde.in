  </defs>

  <rect width="800" height="450" fill="url(#bg-insights)"/>

  <circle cx="650" cy="120" r="220" fill="#6366F1" opacity="0.2" filter="blur(50px)"/>
  <circle cx="150" cy="330" r="180" fill="#4F46E5" opacity="0.15" filter="blur(50px)"/>

  <rect x="220" y="70" width="360" height="290" rx="24" fill="url(#card-insights)" stroke="#A5B4FC" stroke-width="2.5"/>

  <!-- Lightning Spark / Daily Insight Graphic -->
  <g transform="translate(365, 115)">
