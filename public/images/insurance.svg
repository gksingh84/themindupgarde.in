<svg width="800" height="450" viewBox="0 0 800 450" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-insurance" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ECFDF5"/>
      <stop offset="50%" stop-color="#A7F3D0"/>
      <stop offset="100%" stop-color="#F0FDF4"/>
    </linearGradient>
    <linearGradient id="card-insurance" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F0FDF4"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg-insurance)"/>

  <circle cx="650" cy="110" r="220" fill="#10B981" opacity="0.2" filter="blur(50px)"/>
  <circle cx="150" cy="340" r="180" fill="#059669" opacity="0.15" filter="blur(50px)"/>

  <rect x="220" y="70" width="360" height="290" rx="24" fill="url(#card-insurance)" stroke="#6EE7B7" stroke-width="2.5"/>

  <!-- Shield Check Graphic -->
  <g transform="translate(360, 110)">
    <path d="M40 0 L80 15 V45 C80 70, 40 90, 40 90 C40 90, 0 70, 0 45 V15 Z" fill="#059669"/>
    <path d="M25 45 L35 55 L55 35" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <text x="400" y="315" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="22" fill="#064E3B">
    INSURANCE &amp; ASSET PROTECTION
  </text>
  <text x="400" y="340" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="14" fill="#047857">
    Term Life • Health Covers • Risk Mitigation
  </text>
</svg>
