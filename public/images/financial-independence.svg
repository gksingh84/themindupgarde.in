    <rect x="45" y="35" width="25" height="55" rx="6" fill="#A855F7"/>
    <rect x="80" y="20" width="25" height="70" rx="6" fill="#9333EA"/>
    <rect x="115" y="0" width="25" height="90" rx="6" fill="#7E22CE"/>
  </g>

  <text x="400" y="315" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="22" fill="#581C87">
