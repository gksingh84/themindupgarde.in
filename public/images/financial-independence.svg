      <stop offset="0%" stop-color="#FAF5FF"/>
      <stop offset="50%" stop-color="#F3E8FF"/>
      <stop offset="100%" stop-color="#F5F3FF"/>
    </linearGradient>
    <linearGradient id="card-finance" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FAF5FF"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg-finance)"/>

  <circle cx="650" cy="120" r="220" fill="#A855F7" opacity="0.2" filter="blur(50px)"/>
  <circle cx="150" cy="330" r="180" fill="#7C3AED" opacity="0.15" filter="blur(50px)"/>

  <rect x="220" y="70" width="360" height="290" rx="24" fill="url(#card-finance)" stroke="#D8B4FE" stroke-width="2.5"/>

  <g transform="translate(320, 130)">
