<svg width="800" height="450" viewBox="0 0 800 450" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-banking" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="50%" stop-color="#BAE6FD"/>
      <stop offset="100%" stop-color="#F0F9FF"/>
    </linearGradient>
    <linearGradient id="card-banking" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F0F9FF"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg-banking)"/>

  <circle cx="650" cy="120" r="220" fill="#0284C7" opacity="0.2" filter="blur(50px)"/>
  <circle cx="150" cy="330" r="180" fill="#0369A1" opacity="0.15" filter="blur(50px)"/>

  <rect x="220" y="70" width="360" height="290" rx="24" fill="url(#card-banking)" stroke="#7DD3FC" stroke-width="2.5"/>

  <!-- Bank Pillars Graphic -->
  <g transform="translate(355, 115)">
    <path d="M45 0 L90 30 H0 Z" fill="#0284C7"/>
    <rect x="10" y="38" width="14" height="45" rx="3" fill="#0369A1"/>
    <rect x="38" y="38" width="14" height="45" rx="3" fill="#0369A1"/>
    <rect x="66" y="38" width="14" height="45" rx="3" fill="#0369A1"/>
    <rect x="0" y="88" width="90" height="12" rx="4" fill="#0284C7"/>
  </g>

  <text x="400" y="315" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="22" fill="#0C4A6E">
    MODERN BANKING &amp; RATES
  </text>
  <text x="400" y="340" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="14" fill="#0284C7">
    Savings • Fixed Deposits • Credit Cards
  </text>
</svg>
